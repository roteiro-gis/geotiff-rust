[workspace]
members = [
    "tiff-core",
    "tiff-reader",
    "tiff-writer",
    "geotiff-core",
    "geotiff-reader",
    "geotiff-writer",
    "integration-tests/tiff-integration",
    "integration-tests/geotiff-integration",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.9.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roteiro-gis/geotiff-rust"
homepage = "https://github.com/roteiro-gis/geotiff-rust"

[workspace.dependencies]
ndarray = "0.17"
thiserror = "2"
memmap2 = "0.9.11"
lerc-core = "0.4.2"
lerc-reader = "0.4.2"
lerc-writer = "0.4.2"
half = { version = ">=2.4.1, <2.5", default-features = false }
