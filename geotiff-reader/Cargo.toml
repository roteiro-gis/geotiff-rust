[package]
name = "geotiff-reader"
description = "Pure-Rust GeoTIFF reader with optional HTTP range-backed remote access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/geotiff-reader"
keywords = ["geotiff", "cog", "raster", "gis", "read-only"]
categories = ["science", "parser-implementations"]

[dependencies]
geotiff-core = { version = "0.8.1", path = "../geotiff-core" }
ndarray = { workspace = true }
thiserror = { workspace = true }
tiff-reader = { version = "0.8.1", path = "../tiff-reader", optional = true }
lru = { version = "0.16.3", optional = true }
parking_lot = { version = "0.12", optional = true }

[features]
default = ["local", "rayon"]
f16 = ["local", "tiff-reader/f16"]
local = ["dep:tiff-reader"]
rayon = ["local", "tiff-reader/rayon"]
cog = [
    "dep:reqwest",
    "reqwest/blocking",
    "dep:lru",
    "dep:parking_lot",
    "local",
    "rustls-tls",
]
cog-async = [
    "dep:reqwest",
    "dep:tokio",
    "dep:lru",
    "dep:parking_lot",
    "local",
    "rustls-tls",
]
rustls-tls = ["dep:reqwest", "reqwest/rustls-tls"]

[dependencies.reqwest]
version = "0.12"
default-features = false
optional = true

[dependencies.tokio]
version = "1"
default-features = false
features = ["rt", "sync"]
optional = true

[dev-dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread"]
