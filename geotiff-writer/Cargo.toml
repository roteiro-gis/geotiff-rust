[package]
name = "geotiff-writer"
description = "Pure-Rust GeoTIFF and COG writer with compression, tiling, and overview support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/geotiff-writer"
keywords = ["geotiff", "cog", "encoder", "gis", "raster"]
categories = ["science", "encoding"]

[dependencies]
geotiff-core = { version = "0.9.1", path = "../geotiff-core" }
tiff-writer = { version = "0.9.1", path = "../tiff-writer" }
tiff-core = { version = "0.9.1", path = "../tiff-core" }
ndarray = { workspace = true }
thiserror = { workspace = true }
half = { workspace = true, optional = true }

# COG assembly spools blocks to a temporary file on targets that have one.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[features]
f16 = ["dep:half", "tiff-writer/f16"]
