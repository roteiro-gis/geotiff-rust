[package]
name = "geotiff-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
geotiff-core = { version = "0.9.0", path = "../../geotiff-core" }
geotiff-reader = { version = "0.9.0", path = "../../geotiff-reader" }
geotiff-writer = { version = "0.9.0", path = "../../geotiff-writer" }
tiff-core = { version = "0.9.0", path = "../../tiff-core" }
tiff-reader = { version = "0.9.0", path = "../../tiff-reader" }
tiff-writer = { version = "0.9.0", path = "../../tiff-writer" }
ndarray = { workspace = true }
half = { workspace = true, optional = true }

[features]
f16 = [
    "dep:half",
    "geotiff-reader/f16",
    "geotiff-writer/f16",
    "tiff-core/f16",
    "tiff-reader/f16",
    "tiff-writer/f16",
]

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
serde_json = "1"

[[bench]]
name = "reference_compare_bench"
harness = false

[[bench]]
name = "geotiff_reader_reference_compare_bench"
harness = false
