[package]
name = "tiff-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tiff-core = { version = "0.9.0", path = "../../tiff-core" }
tiff-reader = { version = "0.9.0", path = "../../tiff-reader" }
tiff-writer = { version = "0.9.0", path = "../../tiff-writer" }
ndarray = { workspace = true }
half = { workspace = true, optional = true }

[features]
f16 = ["dep:half", "tiff-core/f16", "tiff-reader/f16", "tiff-writer/f16"]

[dev-dependencies]
criterion = "0.5"
proptest = "1"
tempfile = "3"
serde_json = "1"

[[bench]]
name = "reference_compare_bench"
harness = false
