[package]
name = "tiff-writer"
description = "Pure-Rust TIFF/BigTIFF encoder with compression, tiling, and streaming writes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/tiff-writer"
keywords = ["tiff", "bigtiff", "encoder", "raster", "gis"]
categories = ["science", "encoding"]

[dependencies]
tiff-core = { version = "0.8.1", path = "../tiff-core" }
lerc-core = { workspace = true }
lerc-writer = { workspace = true }
thiserror = { workspace = true }
flate2 = { version = "1.0.35", default-features = false, features = ["zlib-rs"] }
weezl = "0.2"
half = { workspace = true, optional = true }

[features]
default = ["jpeg", "zstd"]
f16 = ["dep:half", "tiff-core/f16"]
jpeg = ["dep:jpeg-encoder"]
zstd = ["dep:ruzstd"]

[dependencies.jpeg-encoder]
version = "0.6"
optional = true

[dependencies.ruzstd]
version = "0.8.1"
optional = true
